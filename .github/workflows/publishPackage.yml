name: publishPackage
on:
  push:
    tags:
      - v*
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    - name: install
      run: bun install --frozen-lockfile
    - name: validate
      run: bun run validate
    - name: publish
      run: bun publish
      env:
        NPM_CONFIG_TOKEN: ${{ secrets.npmToken }}
